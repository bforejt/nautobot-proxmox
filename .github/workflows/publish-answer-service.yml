# Publish the answer-service image on a release tag (decision #56).
#
# One tag releases BOTH halves of this repo: the jobs Nautobot syncs from it
# and the answer service the composer runs. They carry one repo version
# (bmc/answer_service/VERSION == JOBS_VERSION in jobs/lib/version.py), and the
# jobs' version handshake (GET /info: version, min_jobs_version) refuses a
# mismatched pair before touching a BMC or a node. So the gate below refuses
# to publish a tag the two files do not both equal: bump both, commit, then
# tag vX.Y.Z on that commit.
#
# The image lands at ghcr.io/bforejt/nautobot-proxmox-answer-service:vX.Y.Z
# (and :latest). The composer pins ANSWER_SERVICE_VERSION to a tag and pulls
# it (docker compose --profile answer-service pull answer-service); :latest
# exists but defeats the pin. GITHUB_TOKEN is enough to push, but the first
# push creates the package PRIVATE: make it public once (GitHub -> Packages ->
# nautobot-proxmox-answer-service -> Package settings -> Change visibility) so
# field hosts pull without a token. The image.source label ties the package
# to this repo.
name: Publish answer-service image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push the answer-service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a tag the version files do not carry
        shell: bash
        run: |
          # The tag minus its v must equal the VERSION the image serves in
          # GET /info AND the JOBS_VERSION the synced jobs report. Strict
          # vX.Y.Z only: the jobs' VERSION_RE and the composer's pin check
          # accept nothing else, so a pre-release tag must never become :latest.
          tag="${GITHUB_REF_NAME#v}"
          version_file=bmc/answer_service/VERSION
          jobs_file=jobs/lib/version.py
          service="$(tr -d '[:space:]' < "$version_file" || true)"
          jobs="$(sed -nE 's/^JOBS_VERSION = "([^"]*)".*/\1/p' "$jobs_file" | head -n 1 || true)"
          ok=1
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z (digits only, no suffix); the jobs cannot parse it, so it is not published"
            exit 1
          fi
          if [ "$service" != "$tag" ]; then
            echo "::error::$version_file says '$service' but tag $GITHUB_REF_NAME needs '$tag'; set the file to $tag, commit, re-tag"
            ok=0
          fi
          if [ "$jobs" != "$tag" ]; then
            echo "::error::$jobs_file has JOBS_VERSION = \"$jobs\" but tag $GITHUB_REF_NAME needs \"$tag\"; set it to $tag, commit, re-tag"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "release $GITHUB_REF_NAME: VERSION=$service JOBS_VERSION=$jobs"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is bmc/ so the profiles bake in (see the Dockerfile's header);
      # the Dockerfile path is relative to the checkout, not the context.
      - uses: docker/build-push-action@v6
        with:
          context: bmc
          file: bmc/answer_service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/bforejt/nautobot-proxmox-answer-service:${{ github.ref_name }}
            ghcr.io/bforejt/nautobot-proxmox-answer-service:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
