# Drop-in service for the nautobot-composer compose project (new dedicated
# container — see docs/baremetal-install.md). Build context is the repo's
# bmc/ directory so the profiles bake into the image.
#
# Volume wiring is the load-bearing part: `node_secrets` is shared with the
# Nautobot container so the text-file secrets this service writes are readable
# by Nautobot's text-file provider at NAUTOBOT_SECRETS_PATH.
services:
  answer-service:
    container_name: answer-service
    build:
      context: ../nautobot-proxmox/bmc          # adjust to your checkout
      dockerfile: answer_service/Dockerfile
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      NAUTOBOT_URL: "http://nautobot:8080"
      NAUTOBOT_TOKEN: "${NAUTOBOT_TOKEN:?set in .env}"
      # How NODES reach this service. HTTPS strongly preferred: the firstboot
      # phone-home carries a live API token. Plain http:// is acceptable ONLY
      # on an isolated lab VLAN — you accept cleartext token transit.
      PUBLIC_URL: "https://10.40.2.10:8800"
      # Self-signed TLS: generate a cert into the tls volume, then set all
      # three (fingerprint = sha256 of the DER cert; also pass it to
      # prepare-install-iso.sh --fingerprint):
      SSL_CERTFILE: "/tls/answer-service.crt"
      SSL_KEYFILE: "/tls/answer-service.key"
      CERT_FINGERPRINT: "${ANSWER_CERT_FINGERPRINT:-}"
      DOMAIN: "nfv.lab"
      TIMEZONE: "America/Chicago"
      ROOT_PASSWORD_HASH_FILE: "/secrets/root_password_hash"
      SECRETS_DIR: "/secrets/nodes"
      NAUTOBOT_SECRETS_PATH: "/opt/nautobot/secrets/nodes"
      # uid/gid of the Nautobot container user (official image: 999) so the
      # written secret files are readable across the shared volume.
      NAUTOBOT_FS_UID: "999"
      NAUTOBOT_FS_GID: "999"
      # ANSWER_AUTH_TOKEN: "nfv:${ANSWER_TOKEN}"  # pair with prepare-iso --answer-auth-token
    volumes:
      - answer_data:/data
      - node_secrets:/secrets
      - answer_tls:/tls
      - ../nautobot-proxmox/bmc/profiles:/app/profiles:ro

volumes:
  answer_data:
  answer_tls:
  node_secrets:
    # Also mount this volume into the Nautobot + worker containers at
    # /opt/nautobot/secrets so the created Secret records resolve:
    #   volumes: [ "node_secrets:/opt/nautobot/secrets" ]
