# SE350 UEFI/BIOS policy — the data ApplyBiosPolicyJob applies via Redfish
# (PATCH /redfish/v1/Systems/{id}/Bios/Settings, applied at next reboot,
# readback-verified).
#
# legacy_standard: the settings the team's existing XCC BIOS tool pushes
# (provided 2026-08-07), carried forward as the confirmed standard.
#
# Attribute names and enum values below were VERIFIED 2026-08-07 against a
# real SE350's dump (SE350 Platform Discovery job; 172 attributes, registry
# BiosAttributeRegistry.1.0.0). Registry-allowed values are recorded per
# setting.
#
# NOTE — sampled-unit drift: the dumped tester unit reads
# OperatingModes_ChooseOperatingMode='MaximumPerformance' (the preset) with
# Processors_MONITORMWAIT='Disable', i.e. NOT at this standard (which wants
# CustomMode + MONITORMWAIT Enable — the preset force-disables MWAIT, which
# is exactly why the tool must use CustomMode). Either the unit predates the
# tool or wasn't standardized — the audit job exists for precisely this.

platform: SE350
machine_types: [7Z46, 7D1X, 7D27]
verified_against: "SE350 discovery dump 2026-08-07 (BiosAttributeRegistry.1.0.0)"

legacy_standard:
  - menu: "Operating Modes -> Choose Operating Mode"
    value: "Custom Mode"
    redfish_attribute: "OperatingModes_ChooseOperatingMode"
    redfish_value: "CustomMode"
    allowed: [MinimalPower, Efficiency_FavorPower, Efficiency_FavorPerformance, CustomMode, MaximumPerformance]
    verified: true
  - menu: "Processors -> C-States"
    value: "Disable"
    redfish_attribute: "Processors_CStates"
    redfish_value: "Disable"
    allowed: [Legacy, Autonomous, Disable]
    verified: true
  - menu: "Processors -> C1 Enhanced Mode"
    value: "Disable"
    redfish_attribute: "Processors_C1EnhancedMode"
    redfish_value: "Disable"
    allowed: [Disable, Enable]
    verified: true
  - menu: "Processors -> Energy Efficient Turbo"
    value: "Disable"
    redfish_attribute: "Processors_EnergyEfficientTurbo"
    redfish_value: "Disable"
    allowed: [Enable, Disable]
    verified: true
  - menu: "Processors -> MONITOR/MWAIT"
    value: "Enable"
    redfish_attribute: "Processors_MONITORMWAIT"
    redfish_value: "Enable"
    allowed: [Disable, Enable]
    verified: true
    note: "Requires CustomMode — the MaximumPerformance preset forces this to Disable."
  - menu: "Power -> Power/Performance Bias"
    value: "Platform Controlled"
    redfish_attribute: "Power_PowerPerformanceBias"
    redfish_value: "PlatformControlled"
    allowed: [PlatformControlled, OSControlled]
    verified: true
  - menu: "Power -> Platform Controlled Type"
    value: "Maximum Performance"
    redfish_attribute: "Power_PlatformControlledType"
    redfish_value: "MaximumPerformance"
    allowed: [MaximumPerformance, Efficiency_FavorPerformance, Efficiency_FavorPower, MinimalPower]
    verified: true
  - menu: "Devices and I/O Ports -> PCI 64-Bit Resource Allocation"
    value: "Auto"
    redfish_attribute: "DevicesandIOPorts_PCI64BitResourceAllocation"
    redfish_value: "Auto"
    allowed: [Disable, Enable, Auto]
    verified: true
  - menu: "Devices and I/O Ports -> MM Config Base"
    value: "3GB"
    redfish_attribute: "DevicesandIOPorts_MMConfigBase"
    redfish_value: "MMConfigBase_3GB"   # enum-prefixed — corrected from bare "3GB"
    allowed: [MMConfigBase_1GB, MMConfigBase_2GB, MMConfigBase_3GB]
    verified: true
  - menu: "Thermal Mode"
    value: "Performance"
    redfish_attribute: null
    verified: false
    note: >
      NOT exposed as a UEFI Bios attribute on SE350 (absent from all 172 dumped
      attributes). Lenovo fan/cooling policy is commonly an XCC-side setting,
      not UEFI — confirm with the legacy tool's owner where it actually sets
      this (XCC API vs a different platform in the tool's scope).

# Settings the plan wants asserted on top of the legacy standard. The sampled
# unit is ALREADY at the desired value for every one of these (factory/current
# state), so these are asserts, not changes — cheap insurance against drift.
proposed_additions:
  - menu: "Devices and I/O Ports -> Console Redirection Settings -> COM Port 1"
    redfish_attribute: "DevicesandIOPorts_COMPort1"
    redfish_value: "Enable"
    observed: "Enable"
    verified: true
  - menu: "Devices and I/O Ports -> Console Redirection Settings -> Console Redirection"
    redfish_attribute: "DevicesandIOPorts_ConsoleRedirection"
    redfish_value: "Auto"
    observed: "Auto"
    verified: true
    note: "Auto = redirect when no local video in use; decide Auto vs forced Enable at the lab serial test (checklist §8)."
  - menu: "COM1 baud / data / parity / stop / emulation / flow"
    redfish_attribute: "DevicesandIOPorts_Com1BaudRate, _Com1DataBits, _Com1Parity, _Com1StopBits, _Com1TerminalEmulation, _Com1FlowControl"
    redfish_value: "Com1BaudRate_115200, Com1DataBits_8, None, Com1StopBits_1, ANSI, Disable"
    observed: "already exactly these values"
    verified: true
  - menu: "Devices and I/O Ports -> Com1 Active After Boot"
    redfish_attribute: "DevicesandIOPorts_Com1ActiveAfterBoot"
    redfish_value: "Disable"
    observed: "Disable"
    verified: true
    note: >
      Governs FIRMWARE-level redirection persisting after OS handoff; the OS
      getty owns ttyS0 regardless, so Disable is likely correct. Confirm during
      the checklist §8 end-to-end serial test before pinning.
  - menu: "Devices and I/O Ports -> Serial Port Sharing / Access Mode"
    redfish_attribute: "DevicesandIOPorts_SerialPortSharing, DevicesandIOPorts_SerialPortAccessMode"
    redfish_value: "Disable, Disable"
    observed: "Disable, Disable"
    verified: true
    note: "Keeps the physical RJ45 host-owned (not shared with XCC)."
  - menu: "Secure Boot"
    redfish_attribute: "SecureBootConfiguration_SecureBootSetting"
    redfish_value: "Disabled"
    observed: "Disabled (SecureBootStatus also Disabled)"
    verified: true

notes:
  - Custom Mode is required because preset operating modes lock (and in
    MaximumPerformance's case, force) the individual knobs — confirmed by the
    sampled unit showing the preset with MONITORMWAIT forced to Disable.
  - With C-states and C1E disabled at BIOS level, the firstboot kernel-cmdline
    C-state caps are likely redundant. Lab-confirm exposed idle states after
    applying this policy (cpupower idle-info), then keep as defense-in-depth
    or drop.
  - Bonus observations from the dump: Processors_HyperThreading='Enable' (SMT
    on — matches the sizing model), OnboardSATAMode='AHCI', Intel VMD
    disabled, and the firmware inventory lists the "ThinkSystem M.2 SED with
    Mirroring Enablement Kit" (x2, FW 2.3.22.1208) — hardware confirmation of
    the mirrored SED boot pair behind the single presented volume.
